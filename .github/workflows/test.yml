name: Test

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}

      - name: Install deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Linter
        run: pnpm run lint
